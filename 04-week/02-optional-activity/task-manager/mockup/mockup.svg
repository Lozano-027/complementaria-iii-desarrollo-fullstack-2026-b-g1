<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="700" fill="#F2F0EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="90" fill="#22314F"/>
  <text x="40" y="55" font-size="26" fill="#F2F0EA" font-weight="bold">Task Manager</text>
  <text x="700" y="55" font-size="14" fill="#C7CEDB">3 pending · 2 done</text>

  <!-- New task form -->
  <rect x="40" y="120" width="820" height="70" rx="6" fill="#FFFFFF" stroke="#D8D3C7"/>
  <rect x="60" y="140" width="540" height="30" rx="4" fill="#F7F5F0" stroke="#D8D3C7"/>
  <text x="75" y="160" font-size="13" fill="#8A8375">Task title...</text>
  <rect x="620" y="140" width="220" height="30" rx="4" fill="#3B6E8F"/>
  <text x="700" y="160" font-size="13" fill="#FFFFFF" text-anchor="middle">+ Add task</text>

  <!-- State indicator note -->
  <text x="40" y="225" font-size="12" fill="#8A8375">[ States below: loading -&gt; skeleton rows | error -&gt; red banner | data -&gt; list ]</text>

  <!-- List item 1 (pending) -->
  <rect x="40" y="245" width="820" height="80" rx="6" fill="#FFFFFF" stroke="#D8D3C7"/>
  <circle cx="70" cy="285" r="10" fill="none" stroke="#D98E3E" stroke-width="2"/>
  <text x="100" y="275" font-size="16" fill="#22314F" font-weight="bold">Buy groceries</text>
  <text x="100" y="298" font-size="12" fill="#8A8375">Created: 2026-08-20</text>
  <rect x="620" y="265" width="70" height="24" rx="12" fill="#F7E1BE"/>
  <text x="655" y="281" font-size="11" fill="#8A5A0E" text-anchor="middle">pending</text>
  <text x="710" y="281" font-size="13" fill="#3B6E8F">Edit</text>
  <text x="760" y="281" font-size="13" fill="#B23A48">Delete</text>

  <!-- List item 2 (completed) -->
  <rect x="40" y="335" width="820" height="80" rx="6" fill="#FFFFFF" stroke="#D8D3C7"/>
  <circle cx="70" cy="375" r="10" fill="#5B8266" stroke="#5B8266" stroke-width="2"/>
  <path d="M65,375 l4,4 l7,-8" stroke="white" stroke-width="2" fill="none"/>
  <text x="100" y="365" font-size="16" fill="#8A8375" text-decoration="line-through">Pay electricity bill</text>
  <text x="100" y="388" font-size="12" fill="#8A8375">Created: 2026-08-18</text>
  <rect x="620" y="355" width="80" height="24" rx="12" fill="#DCEAE1"/>
  <text x="660" y="371" font-size="11" fill="#2F5A45" text-anchor="middle">completed</text>
  <text x="710" y="371" font-size="13" fill="#3B6E8F">Edit</text>
  <text x="760" y="371" font-size="13" fill="#B23A48">Delete</text>

  <!-- List item 3 (pending) -->
  <rect x="40" y="425" width="820" height="80" rx="6" fill="#FFFFFF" stroke="#D8D3C7"/>
  <circle cx="70" cy="465" r="10" fill="none" stroke="#D98E3E" stroke-width="2"/>
  <text x="100" y="455" font-size="16" fill="#22314F" font-weight="bold">Study for database exam</text>
  <text x="100" y="478" font-size="12" fill="#8A8375">Created: 2026-08-27</text>
  <rect x="620" y="445" width="70" height="24" rx="12" fill="#F7E1BE"/>
  <text x="655" y="461" font-size="11" fill="#8A5A0E" text-anchor="middle">pending</text>
  <text x="710" y="461" font-size="13" fill="#3B6E8F">Edit</text>
  <text x="760" y="461" font-size="13" fill="#B23A48">Delete</text>

  <!-- Error banner state (shown separately as annotation) -->
  <rect x="40" y="540" width="820" height="50" rx="6" fill="#F7D9DC" stroke="#B23A48"/>
  <text x="60" y="570" font-size="13" fill="#7A222E">Error state: "Could not load tasks. Check your connection and try again." [Retry]</text>

  <!-- Loading skeleton annotation -->
  <rect x="40" y="610" width="820" height="24" rx="4" fill="#E4E1D8"/>
  <rect x="40" y="642" width="820" height="24" rx="4" fill="#E4E1D8"/>
  <text x="40" y="685" font-size="12" fill="#8A8375">Loading state: animated skeleton placeholders while fetch() resolves</text>
</svg>
